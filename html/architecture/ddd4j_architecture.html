<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>ddd4j Boot 架构视图 (优化版)</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background-color: #F5F5F7; /* iOS System Gray 6 */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 40px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<div class="container">
    <!--
       SVG Design Logic:
       Width: 1120px (1200 - 80 padding)
       Left Column (Label): 120px
       Gap: 20px
       Right Column (Content): 980px

       Vertical Layout:
       1. Samples (Top): Height 100px
       2. Gap: 30px
       3. Components: Height 240px (3 rows)
       4. Gap: 30px
       5. Core: Height 160px
       6. Gap: 30px
       7. Management: Height 90px

       Total SVG Height: ~700px
    -->
    <svg height="700" viewBox="0 0 1120 700" width="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Filters for iOS/Material depth -->
            <filter height="120%" id="dropShadow" width="120%" x="-10%" y="-10%">
                <feDropShadow dx="0" dy="2" flood-color="#000000" flood-opacity="0.08" stdDeviation="4"/>
            </filter>
            <filter height="120%" id="innerGlow" width="120%" x="-10%" y="-10%">
                <feFlood flood-color="#FFFFFF" flood-opacity="0.3"/>
                <feComposite in2="SourceGraphic" operator="out"/>
                <feGaussianBlur stdDeviation="2"/>
                <feComposite in2="SourceGraphic" operator="atop"/>
            </filter>

            <!-- Gradients -->
            <linearGradient id="bg-samples" x1="0%" x2="0%" y1="0%" y2="100%">
                <stop offset="0%" style="stop-color:#F5F5F7"/>
                <stop offset="100%" style="stop-color:#E5E5EA"/>
            </linearGradient>
            <linearGradient id="bg-blue" x1="0%" x2="100%" y1="0%" y2="100%">
                <stop offset="0%" style="stop-color:#007AFF"/>
                <stop offset="100%" style="stop-color:#0056B3"/>
            </linearGradient>
            <linearGradient id="bg-green" x1="0%" x2="100%" y1="0%" y2="100%">
                <stop offset="0%" style="stop-color:#34C759"/>
                <stop offset="100%" style="stop-color:#248A3D"/>
            </linearGradient>
            <linearGradient id="bg-orange" x1="0%" x2="100%" y1="0%" y2="100%">
                <stop offset="0%" style="stop-color:#FF9500"/>
                <stop offset="100%" style="stop-color:#C66900"/>
            </linearGradient>
            <linearGradient id="bg-purple" x1="0%" x2="100%" y1="0%" y2="100%">
                <stop offset="0%" style="stop-color:#5856D6"/>
                <stop offset="100%" style="stop-color:#3634A3"/>
            </linearGradient>
        </defs>

        <!-- ==============================
             Layer 1: 应用示例 (Samples)
             Y: 0, Height: 100
        =============================== -->
        <g transform="translate(0, 0)">
            <!-- Left Label -->
            <rect fill="url(#bg-purple)" filter="url(#dropShadow)" height="100" rx="16" width="120" x="0" y="0"/>
            <text dominant-baseline="middle" fill="white" font-size="16" font-weight="bold" text-anchor="middle" x="60"
                  y="55">应用示例
            </text>

            <!-- Right Content Container -->
            <rect fill="#F2F2F7" height="100" rx="16" stroke="#E5E5EA" stroke-width="1" width="980" x="140" y="0"/>

            <!-- Items Row -->
            <g transform="translate(150, 15)">
                <!-- 7 items, ~130px each + 10px gap -->
                <g>
                    <rect fill="white" filter="url(#dropShadow)" height="70" rx="10" width="125" x="0" y="0"/>
                    <text dominant-baseline="middle" fill="#333" font-size="13" font-weight="500" text-anchor="middle"
                          x="62.5"
                          y="35">Druid / HikariCP
                    </text>
                </g>
                <g transform="translate(135, 0)">
                    <rect fill="white" filter="url(#dropShadow)" height="70" rx="10" width="125" x="0" y="0"/>
                    <text dominant-baseline="middle" fill="#333" font-size="13" font-weight="500" text-anchor="middle"
                          x="62.5"
                          y="35">ActiveMQ
                    </text>
                </g>
                <g transform="translate(270, 0)">
                    <rect fill="white" filter="url(#dropShadow)" height="70" rx="10" width="125" x="0" y="0"/>
                    <text dominant-baseline="middle" fill="#333" font-size="13" font-weight="500" text-anchor="middle"
                          x="62.5"
                          y="35">RabbitMQ
                    </text>
                </g>
                <g transform="translate(405, 0)">
                    <rect fill="white" filter="url(#dropShadow)" height="70" rx="10" width="125" x="0" y="0"/>
                    <text dominant-baseline="middle" fill="#333" font-size="13" font-weight="500" text-anchor="middle"
                          x="62.5"
                          y="35">Kafka
                    </text>
                </g>
                <g transform="translate(540, 0)">
                    <rect fill="white" filter="url(#dropShadow)" height="70" rx="10" width="125" x="0" y="0"/>
                    <text dominant-baseline="middle" fill="#333" font-size="13" font-weight="500" text-anchor="middle"
                          x="62.5"
                          y="35">RocketMQ
                    </text>
                </g>
                <g transform="translate(675, 0)">
                    <rect fill="white" filter="url(#dropShadow)" height="70" rx="10" width="125" x="0" y="0"/>
                    <text dominant-baseline="middle" fill="#333" font-size="13" font-weight="500" text-anchor="middle"
                          x="62.5"
                          y="35">MQTT
                    </text>
                </g>
                <g transform="translate(810, 0)">
                    <rect fill="white" filter="url(#dropShadow)" height="70" rx="10" width="125" x="0" y="0"/>
                    <text dominant-baseline="middle" fill="#333" font-size="13" font-weight="500" text-anchor="middle"
                          x="62.5"
                          y="35">WebFlux
                    </text>
                </g>
            </g>
        </g>

        <!-- ==============================
             Layer 2: 功能组件 (Components)
             Y: 130, Height: 240
        =============================== -->
        <g transform="translate(0, 130)">
            <!-- Left Label -->
            <rect fill="url(#bg-green)" filter="url(#dropShadow)" height="240" rx="16" width="120" x="0" y="0"/>
            <text dominant-baseline="middle" fill="white" font-size="16" font-weight="bold" text-anchor="middle" x="60"
                  y="120">功能组件
            </text>

            <!-- Right Content Container -->
            <rect fill="#F2F2F7" height="240" rx="16" stroke="#E5E5EA" stroke-width="1" width="980" x="140" y="0"/>

            <!-- Inner Layout: 3 Rows -->
            <g transform="translate(150, 15)">

                <!-- Row 1: Web & Data (Green Tint) -->
                <g>
                    <rect fill="#E8F5E9" height="64" rx="10" stroke="#C8E6C9" stroke-width="0.5" width="960" x="0"
                          y="0"/>
                    <text dominant-baseline="middle" fill="#2E7D32" font-size="14" font-weight="bold" x="20" y="32">
                        Web与数据
                    </text>
                    <!-- Items -->
                    <g transform="translate(110, 12)">
                        <rect fill="white" filter="url(#dropShadow)" height="40" rx="6" width="150" x="0" y="0"/>
                        <text dominant-baseline="middle" fill="#333" font-size="13" text-anchor="middle" x="75" y="20">
                            WebMVC
                        </text>

                        <rect fill="white" filter="url(#dropShadow)" height="40" rx="6" width="150" x="170" y="0"/>
                        <text dominant-baseline="middle" fill="#333" font-size="13" text-anchor="middle" x="245" y="20">
                            WebFlux
                        </text>

                        <rect fill="white" filter="url(#dropShadow)" height="40" rx="6" width="150" x="340" y="0"/>
                        <text dominant-baseline="middle" fill="#333" font-size="13" text-anchor="middle" x="415" y="20">
                            Jackson
                        </text>

                        <rect fill="white" filter="url(#dropShadow)" height="40" rx="6" width="150" x="510" y="0"/>
                        <text dominant-baseline="middle" fill="#333" font-size="13" text-anchor="middle" x="585" y="20">
                            Validation
                        </text>

                        <rect fill="white" filter="url(#dropShadow)" height="40" rx="6" width="150" x="680" y="0"/>
                        <text dominant-baseline="middle" fill="#333" font-size="13" text-anchor="middle" x="755" y="20">
                            External
                        </text>
                    </g>
                </g>

                <!-- Row 2: Security (Blue Tint - visually distinct inside green theme) -->
                <g transform="translate(0, 74)">
                    <rect fill="#E3F2FD" height="64" rx="10" stroke="#BBDEFB" stroke-width="0.5" width="960" x="0"
                          y="0"/>
                    <text dominant-baseline="middle" fill="#1565C0" font-size="14" font-weight="bold" x="20" y="32">
                        安全与权限
                    </text>
                    <!-- Items -->
                    <g transform="translate(110, 12)">
                        <rect fill="white" filter="url(#dropShadow)" height="40" rx="6" width="150" x="0" y="0"/>
                        <text dominant-baseline="middle" fill="#333" font-size="13" text-anchor="middle" x="75" y="20">
                            SaToken
                        </text>

                        <rect fill="white" filter="url(#dropShadow)" height="40" rx="6" width="150" x="170" y="0"/>
                        <text dominant-baseline="middle" fill="#333" font-size="13" text-anchor="middle" x="245" y="20">
                            DataScope
                        </text>

                        <rect fill="white" filter="url(#dropShadow)" height="40" rx="6" width="150" x="340" y="0"/>
                        <text dominant-baseline="middle" fill="#333" font-size="13" text-anchor="middle" x="415" y="20">
                            License
                        </text>

                        <rect fill="white" filter="url(#dropShadow)" height="40" rx="6" width="150" x="510" y="0"/>
                        <text dominant-baseline="middle" fill="#333" font-size="13" text-anchor="middle" x="585" y="20">
                            Crypto (加解密)
                        </text>
                    </g>
                </g>

                <!-- Row 3: Architecture (Orange Tint) -->
                <g transform="translate(0, 148)">
                    <rect fill="#FFF3E0" height="64" rx="10" stroke="#FFE0B2" stroke-width="0.5" width="960" x="0"
                          y="0"/>
                    <text dominant-baseline="middle" fill="#EF6C00" font-size="14" font-weight="bold" x="20" y="32">
                        架构与中间件
                    </text>
                    <!-- Items -->
                    <g transform="translate(110, 12)">
                        <rect fill="white" filter="url(#dropShadow)" height="40" rx="6" width="150" x="0" y="0"/>
                        <text dominant-baseline="middle" fill="#333" font-size="13" text-anchor="middle" x="75" y="20">
                            COLA 架构
                        </text>

                        <rect fill="white" filter="url(#dropShadow)" height="40" rx="6" width="150" x="170" y="0"/>
                        <text dominant-baseline="middle" fill="#333" font-size="13" text-anchor="middle" x="245" y="20">
                            PF4J 插件
                        </text>

                        <rect fill="white" filter="url(#dropShadow)" height="40" rx="6" width="150" x="340" y="0"/>
                        <text dominant-baseline="middle" fill="#333" font-size="13" text-anchor="middle" x="415" y="20">
                            Akka Actor
                        </text>

                        <rect fill="white" filter="url(#dropShadow)" height="40" rx="6" width="150" x="510" y="0"/>
                        <text dominant-baseline="middle" fill="#333" font-size="13" text-anchor="middle" x="585" y="20">
                            Logs 日志
                        </text>

                        <rect fill="white" filter="url(#dropShadow)" height="40" rx="6" width="150" x="680" y="0"/>
                        <text dominant-baseline="middle" fill="#333" font-size="13" text-anchor="middle" x="755" y="20">
                            Kafka
                        </text>
                    </g>
                </g>

            </g>
        </g>

        <!-- ==============================
             Layer 3: 核心基础 (Core)
             Y: 400, Height: 160
        =============================== -->
        <g transform="translate(0, 400)">
            <!-- Left Label -->
            <rect fill="url(#bg-blue)" filter="url(#dropShadow)" height="160" rx="16" width="120" x="0" y="0"/>
            <text dominant-baseline="middle" fill="white" font-size="16" font-weight="bold" text-anchor="middle" x="60"
                  y="80">核心基础
            </text>

            <!-- Right Content Container -->
            <rect fill="#F2F2F7" height="160" rx="16" stroke="#E5E5EA" stroke-width="1" width="980" x="140" y="0"/>

            <!-- 3 Columns -->
            <g transform="translate(150, 15)">
                <!-- Column 1: API -->
                <g>
                    <rect fill="white" filter="url(#dropShadow)" height="130" rx="10" stroke="#BBDEFB"
                          stroke-width="0.5" width="310" x="0"
                          y="0"/>
                    <rect fill="#E3F2FD" height="36" rx="10" width="310" x="0" y="0"/>
                    <text dominant-baseline="middle" fill="#1565C0" font-size="14" font-weight="bold"
                          text-anchor="middle" x="155"
                          y="22">基础 API (API Support)
                    </text>

                    <g transform="translate(15, 46)">
                        <text fill="#555" font-size="12" x="0" y="10">• BaseController / Service / Mapper</text>
                        <text fill="#555" font-size="12" x="0" y="32">• ApiRestResponse / Result</text>
                        <text fill="#555" font-size="12" x="0" y="54">• ApiModule / ApiOperationLog</text>
                        <text fill="#555" font-size="12" x="0" y="76">• Global Exception Handling</text>
                    </g>
                </g>

                <!-- Column 2: Objects -->
                <g transform="translate(325, 0)">
                    <rect fill="white" filter="url(#dropShadow)" height="130" rx="10" stroke="#BBDEFB"
                          stroke-width="0.5" width="310" x="0"
                          y="0"/>
                    <rect fill="#E3F2FD" height="36" rx="10" width="310" x="0" y="0"/>
                    <text dominant-baseline="middle" fill="#1565C0" font-size="14" font-weight="bold"
                          text-anchor="middle" x="155"
                          y="22">领域对象 (Domain Objects)
                    </text>
                    <g transform="translate(15, 46)">
                        <text fill="#555" font-size="12" x="0" y="10">• BaseDTO / BaseEntity / BaseParam</text>
                        <text fill="#555" font-size="12" x="0" y="32">• BizRuntimeException / BizException</text>
                        <text fill="#555" font-size="12" x="0" y="54">• Subject / AuthPrincipal</text>
                        <text fill="#555" font-size="12" x="0" y="76">• Constants / Enums</text>
                    </g>
                </g>

                <!-- Column 3: Utils -->
                <g transform="translate(650, 0)">
                    <rect fill="white" filter="url(#dropShadow)" height="130" rx="10" stroke="#BBDEFB"
                          stroke-width="0.5" width="310" x="0"
                          y="0"/>
                    <rect fill="#E3F2FD" height="36" rx="10" width="310" x="0" y="0"/>
                    <text dominant-baseline="middle" fill="#1565C0" font-size="14" font-weight="bold"
                          text-anchor="middle" x="155"
                          y="22">通用工具 (Utilities)
                    </text>
                    <g transform="translate(15, 46)">
                        <text fill="#555" font-size="12" x="0" y="10">• WebUtils / IdempotentUtils</text>
                        <text fill="#555" font-size="12" x="0" y="32">• DateUtils / CollectionUtils</text>
                        <text fill="#555" font-size="12" x="0" y="54">• Sequence / RandomString</text>
                        <text fill="#555" font-size="12" x="0" y="76">• IP2Region / UserAgent</text>
                    </g>
                </g>
            </g>
        </g>

        <!-- ==============================
             Layer 4: 工程管理 (Management)
             Y: 590, Height: 90
        =============================== -->
        <g transform="translate(0, 590)">
            <!-- Left Label -->
            <rect fill="url(#bg-orange)" filter="url(#dropShadow)" height="90" rx="16" width="120" x="0" y="0"/>
            <text dominant-baseline="middle" fill="white" font-size="16" font-weight="bold" text-anchor="middle" x="60"
                  y="45">工程管理
            </text>

            <!-- Right Content Container -->
            <rect fill="#FFF8E1" height="90" rx="16" stroke="#FFE0B2" stroke-width="1" width="980" x="140" y="0"/>

            <!-- 3 Big Boxes -->
            <g transform="translate(150, 15)">
                <!-- BOM -->
                <g>
                    <rect fill="white" filter="url(#dropShadow)" height="60" rx="10" stroke="#FFCC80" stroke-width="0.5"
                          width="310" x="0"
                          y="0"/>
                    <text dominant-baseline="middle" fill="#E65100" font-size="14" font-weight="bold"
                          text-anchor="middle" x="155"
                          y="30">ddd4j-boot-bom (BOM依赖管理)
                    </text>
                </g>

                <!-- Parent -->
                <g transform="translate(325, 0)">
                    <rect fill="white" filter="url(#dropShadow)" height="60" rx="10" stroke="#FFCC80" stroke-width="0.5"
                          width="310" x="0"
                          y="0"/>
                    <text dominant-baseline="middle" fill="#E65100" font-size="14" font-weight="bold"
                          text-anchor="middle" x="155"
                          y="30">ddd4j-boot-parent (Maven父工程)
                    </text>
                </g>

                <!-- Dependencies -->
                <g transform="translate(650, 0)">
                    <rect fill="white" filter="url(#dropShadow)" height="60" rx="10" stroke="#FFCC80" stroke-width="0.5"
                          width="310" x="0"
                          y="0"/>
                    <text dominant-baseline="middle" fill="#E65100" font-size="14" font-weight="bold"
                          text-anchor="middle" x="155"
                          y="30">ddd4j-boot-dependencies (版本控制)
                    </text>
                </g>
            </g>
        </g>

    </svg>
</div>
</body>
</html>
