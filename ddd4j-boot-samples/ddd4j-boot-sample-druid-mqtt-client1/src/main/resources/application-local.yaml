################################################################################################################
###Spring Boot 相关组件（SpringMVC、Freemarker、Session、Cache、DataSource）配置：
################################################################################################################
spring:
  # 缓存配置：
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterAccess=600s
    redis:
      key-prefix: demo
      time-to-live: 600s
      cache-null-values: false
      use-key-prefix: true
  # 数据源配置：
  datasource:
    name: demo
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.1.170:13306/demo?zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=GMT%2B8
    username: demo
    password: hSy5aj8dD8ttTcjt
  # Redis相关配置
  redis:
    # Redis服务器地址
    host: 192.168.1.170
    # Redis服务器连接端口
    port: 16379
    # Database 索引；和其他服务区别开
    database: 0
    # Redis服务器连接密码（默认为空）
    password: hpkRzkC7pcDnYp3e
  # MQTT相关配置
  mqtt:
    url: tcp://localhost:1883
    client-id: gateway-${random.uuid}
    username: mqtt_user
    password: mqtt_password
    default-topic: /sensor/data

