################################################################################################################
###RocketMQ (RocketMQProperties) 配置：
################################################################################################################
rocketmq:
  # 访问地址
  name-server: 124.221.173.158:9876
  producer:
    # 必须指定group
    group: Pro-Group
    namespace-v2: jeebiz-v2
    namespace: jeebiz
    # 消息发送超时时长，默认3s
    send-message-timeout: 3000
    # 同步发送消息失败重试次数，默认2
    retry-times-when-send-failed: 3
    # 异步发送消息失败重试次数，默认2
    retry-times-when-send-async-failed: 3
  consumer:
    group: Pro-Group
    namespace-v2: jeebiz-v2
    namespace: jeebiz
  pull-consumer:
    group: Pro-Group
    namespace-v2: jeebiz-v2
    namespace: jeebiz

################################################################################################################
###Sms4j (RocketMQProperties) 配置：
################################################################################################################
sms:
  config-type: yaml
  account-max: 3
  minute-max: 10000
  core-pool-size: 8
  max-pool-size: 64
  queue-capacity: 10240